[package]
name = "triton-bridge"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "0.1 contract for a Triton/PTX launch bridge. bridge_ready() is false. Not a Triton port."
authors = ["Tyler Zervas <tz-dev@vectorweight.com>"]
repository = "https://github.com/tzervas/triton-bridge-rs"
homepage = "https://github.com/tzervas/triton-bridge-rs"
documentation = "https://docs.rs/triton-bridge"
readme = "README.md"
keywords = ["cuda", "ptx", "gpu", "kernels", "ffi"]
categories = ["science"]
exclude = [".github/", "docs/REVIEW_0_1.md"]

[features]
default = []
# Reserved for Phase 1 (cudarc / module load). Does NOT load CUDA in 0.1.0.
# Does NOT flip bridge_ready() to true.
cuda = []
# Reserved for Phase 2 (optional CPython compile). Does NOT embed Python in 0.1.0.
python = []

[dependencies]

[lints.rust]
# Phase 1 `cuda` will need a tiny unsafe window for driver pointers.
# 0.1.0 has no such code; keep forbid so we cannot sneak it in early.
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
module_name_repetitions = "allow"

[package.metadata.commitizen]
# Source of truth is .cz.toml; this is a reminder for `cargo` users.
semver = "0.x"
