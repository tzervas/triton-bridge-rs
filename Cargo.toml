[package]
name = "triton-bridge"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Triton/PTX launch bridge. Default: contract only. --features cuda: libcuda load/launch. Not a Triton port."
authors = ["Tyler Zervas <tz-dev@vectorweight.com>"]
repository = "https://github.com/tzervas/triton-bridge-rs"
homepage = "https://github.com/tzervas/triton-bridge-rs"
documentation = "https://docs.rs/triton-bridge"
readme = "README.md"
keywords = ["cuda", "ptx", "gpu", "kernels", "ffi"]
categories = ["science"]
exclude = [".github/", "docs/REVIEW_0_1.md"]

[features]
default = []
# Phase 1: link libcuda via libloading. Does NOT embed Python.
# bridge_ready() is runtime-true only when a device exists.
cuda = ["dep:libloading"]
# Reserved for Phase 2 (optional CPython compile). Does NOT embed Python in 0.2.
python = []

[dependencies]
libloading = { version = "0.8", optional = true }

[lints.rust]
# crate-level forbid is in lib.rs for !cuda; cuda_loader allows a tiny window.
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
module_name_repetitions = "allow"

[package.metadata.commitizen]
semver = "0.x"
